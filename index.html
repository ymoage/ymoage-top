<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ymoage.com — Portal</title>
  <meta name="description" content="ymoage.com のポータルサイト。メインサイトおよび AI 小説ブログ（novel.ymoage.com）への案内ページです。">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6010318292988376"
       crossorigin="anonymous"></script>
  <style>
    :root {
      --accent: #b0703a;
      --bg: #faf9f7;
      --card: #ffffff;
      --text: #2c2a28;
      --muted: #6b6560;
      --border: rgba(44, 42, 40, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181716;
        --card: #22201e;
        --text: #eae6e1;
        --muted: #a39d96;
        --border: rgba(234, 230, 225, 0.14);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px 40px;
    }
    header {
      margin-bottom: 36px;
      border-left: 4px solid var(--accent);
      padding-left: 16px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .cards {
      display: grid;
      gap: 16px;
    }
    .card {
      display: block;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .card-title {
      margin: 0 0 6px;
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--accent);
    }
    .card-desc {
      margin: 0;
      font-size: 0.92rem;
      color: var(--muted);
    }
    footer {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    footer a {
      color: inherit;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ymoage.com</h1>
      <p class="lead">ymoage の各サイト・プロジェクトへの案内ページです。</p>
    </header>

    <section class="cards">
      <a class="card" href="https://www.ymoage.com/">
        <h2 class="card-title">ymoage メインサイト（www.ymoage.com）</h2>
        <p class="card-desc">ポートフォリオや活動全体の案内を掲載しているメインサイトです。</p>
      </a>

      <a class="card" href="https://novel.ymoage.com/">
        <h2 class="card-title">AI小説ブログ（novel.ymoage.com）</h2>
        <p class="card-desc">『水曜日の朝、信号が青になるまで』『ケセラ瀬良なんです！』『天声人誤』『Haizakura』（英語連載）などの連載小説を公開しています。</p>
      </a>
    </section>

    <footer>
      <a href="https://novel.ymoage.com/privacy">プライバシーポリシー / Privacy Policy</a>
    </footer>
  </main>
</body>
</html>
